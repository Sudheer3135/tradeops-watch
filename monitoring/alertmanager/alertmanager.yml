# Baseline receiver keeps alerts visible in the UI without sending messages.
# Severity routing, inhibition, and optional Telegram are Step 4.
global:
  resolve_timeout: 5m
route:
  receiver: local-ui
  group_by: [alertname, service]
  group_wait: 15s
  group_interval: 1m
  repeat_interval: 4h
receivers:
  - name: local-ui
