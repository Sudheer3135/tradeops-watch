global:
  resolve_timeout: 5m
route:
  receiver: local-ui
  group_by: [alertname, service]
  group_wait: 15s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - receiver: p1
      matchers: ['severity="P1"']
      group_wait: 5s
      repeat_interval: 30m
    - receiver: p2
      matchers: ['severity="P2"']
      group_wait: 15s
      repeat_interval: 2h
    - receiver: p3
      matchers: ['severity="P3"']
      group_wait: 30s
      repeat_interval: 4h
inhibit_rules:
  - source_matchers: ['alertname="ServiceDown"', 'severity="P1"']
    target_matchers: ['severity=~"P2|P3"']
    equal: [service, environment]
  - source_matchers: ['alertname="ServiceDown"', 'severity="P1"']
    target_matchers: ['alertname=~"HealthProbeFailed|NoPricesFlowing"']
    equal: [service, environment]
receivers:
  - name: local-ui
  - name: p1
  - name: p2
  - name: p3
